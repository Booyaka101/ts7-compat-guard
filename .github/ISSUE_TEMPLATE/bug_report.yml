name: Bug report
description: Something didn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what came back.
      placeholder: |
        $ npx ts7-compat-guard
        Error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ts7-compat-guard version
      description: Output of `npx ts7-compat-guard --version`
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node version, TypeScript version and OS
      description: Output of `node --version` and `npx tsc --version`, plus your OS.
      placeholder: v22.18.0, TypeScript 5.9.2, on Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: json
    attributes:
      label: Output of `npx ts7-compat-guard --json`
      description: The machine-readable report says which rule fired and on what, which is usually the whole diagnosis.
      render: json
