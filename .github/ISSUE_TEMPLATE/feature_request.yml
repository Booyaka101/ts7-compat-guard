name: Feature request
description: Suggest something ts7-compat-guard should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Reads `package.json` and `tsconfig.json` and the installed `node_modules/*/package.json` versions. It never compiles your code.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
