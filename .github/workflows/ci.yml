name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  bundle-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      # Fails the build if dist/action.js was not rebuilt+committed after a src change.
      - run: npm run build
      - run: git diff --exit-code -- dist/ || (echo "::error::dist/ is stale — run 'npm run build' and commit dist/action.js" && exit 1)

  action-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npx --yes -p @action-validator/core -p @action-validator/cli action-validator ./action.yml

  self-test:
    # Dogfood: run our own action against the repo's package.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          package-dir: .
          mode: warn
