name: Release

# Publishes ts7-compat-guard to npm with provenance when a v* tag is pushed.
#
# id-token: write is what makes --provenance work. npm rejects the flag without
# it, and the permission is never granted by default.
#
# Needs an NPM_TOKEN secret (automation token). Without one the build and tests
# still run as release validation and the publish step skips cleanly, so a tag
# push never red-Xs just because CI cannot do the interactive 2FA.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      # The bundle is committed and runs directly on consumers' runners, so it
      # gets a signed provenance statement. Verify with:
      #   gh attestation verify dist/<file> --repo Booyaka101/ts7-compat-guard
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No NPM_TOKEN configured. Build and tests passed; publish by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          if npm view "ts7-compat-guard@$VERSION" version >/dev/null 2>&1; then
            echo "ts7-compat-guard@$VERSION is already on the registry, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --provenance --access public
            echo "Published ts7-compat-guard@$VERSION with provenance." >> "$GITHUB_STEP_SUMMARY"
          fi
