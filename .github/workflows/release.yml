name: Release

# Publishes ts7-compat-guard to npm when a v* tag is pushed.
#
# Auth is npm Trusted Publishing (OIDC), not a token. The package on npmjs.com
# names this repo and this workflow filename as its trusted publisher, so the
# id-token below is the whole credential -- nothing to leak, rotate or lose --
# and provenance is attached automatically (no --provenance flag needed).
#
# Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with Node
# 22, hence the explicit upgrade step. Without it the publish fails with an
# auth error that reads like a bad token.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Meet the trusted-publishing version floor
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The bundle is committed and runs directly on consumers' runners, so it
      # gets a signed provenance statement. Verify with:
      #   gh attestation verify dist/<file> --repo Booyaka101/ts7-compat-guard
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "ts7-compat-guard@$VERSION" version >/dev/null 2>&1; then
            echo "ts7-compat-guard@$VERSION is already on the registry, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --access public
            echo "Published ts7-compat-guard@$VERSION with provenance." >> "$GITHUB_STEP_SUMMARY"
          fi
